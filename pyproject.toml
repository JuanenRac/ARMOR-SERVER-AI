[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-server-ai"
version = "0.2.9"
description = "A.R.M.O.R. visual observation policy and engine registry"
requires-python = ">=3.11"

[project.scripts]
armor-vision-policy = "armor_server_ai.cli:main"
armor-ai = "armor_server_ai.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 240

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
